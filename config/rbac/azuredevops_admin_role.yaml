# This rule is not used by the project azdo-agent-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over agents.fr.simplified.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: azdo-agent-operator
    app.kubernetes.io/managed-by: kustomize
  name: azuredevops-admin-role
rules:
- apiGroups:
  - agents.fr.simplified
  resources:
  - azuredevops
  verbs:
  - '*'
- apiGroups:
  - agents.fr.simplified
  resources:
  - azuredevops/status
  verbs:
  - get
