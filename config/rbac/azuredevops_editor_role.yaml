# This rule is not used by the project azdo-agent-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the agents.omnivya.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: azdo-agent-operator
    app.kubernetes.io/managed-by: kustomize
  name: azuredevops-editor-role
rules:
- apiGroups:
  - agents.omnivya
  resources:
  - azuredevops
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.omnivya
  resources:
  - azuredevops/status
  verbs:
  - get
