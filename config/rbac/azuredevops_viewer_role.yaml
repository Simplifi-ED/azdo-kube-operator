# This rule is not used by the project azdo-agent-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to agents.fr.simplified resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: azdo-agent-operator
    app.kubernetes.io/managed-by: kustomize
  name: azuredevops-viewer-role
rules:
- apiGroups:
  - agents.fr.simplified
  resources:
  - azuredevops
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agents.fr.simplified
  resources:
  - azuredevops/status
  verbs:
  - get
